name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test -race -count=1 ./...
  # The scaled backends (plan Step 22): a real Postgres, no tokens.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harness"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # -p 1: both packages clear tables in this one database, and packages run
      # in parallel by default, so the store tests emptied the queue tests' rows
      # mid-run. Same flag as `make postgres-test`.
      - run: go test -tags postgres -count=1 -p 1 ./internal/store/postgres/... ./internal/queue/postgres/...
        env:
          HARNESS_TEST_POSTGRES_DSN: postgres://harness:harness@localhost:5432/harness_test?sslmode=disable

  # The Helm chart renders valid Kubernetes and a config the binary accepts.
  # Free, and it catches the class of break that otherwise surfaces as a
  # crash-looping pod on the first rollout.
  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@v4
      - run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - run: scripts/k8s-validate.sh

  # Known vulnerabilities in the dependency tree, reachable-symbol filtered.
  # It is the one check that fails on something nobody in this repo changed —
  # an advisory published against a module already in go.sum.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
