# Layer 4: the golden suite and the regression gate (plan Steps 19 and 20).
#
# Two jobs, because they cost very different things:
#
#   validate  — free. Runs on every PR. Proves every case file parses, points at
#               a fixture that exists, and builds a task the harness accepts.
#   gate      — spends tokens. Runs nightly, and on a PR that touches the things
#               a golden regression actually comes from: prompt templates,
#               CLAUDE.md, tool policies, the evaluation code, or the pinned CLI
#               and model. Blocked when the pass rate drops more than the delta.
name: golden

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 03:30 UTC nightly.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      max_cost_usd:
        description: "suite cost cap in dollars"
        default: "8"

env:
  # The nightly budget. `harness eval run` stops once this is spent and marks
  # the report BudgetExhausted, which the gate refuses to accept — a truncated
  # run can neither block nor bless a change.
  MAX_COST_USD: ${{ github.event.inputs.max_cost_usd || '8' }}
  BASELINE: evals/reports/baseline.json
  # The absolute floor, enforced alongside the baseline delta. Without it the
  # gate only ever compares against yesterday, so losing one case of 21 (4.8%,
  # inside a 5% delta) passes every night and the bar walks down for free.
  MIN_PASS_RATE: "0.8"

jobs:
  # Free on every PR: a malformed case must fail here, not in a paid run.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./internal/eval/golden/... ./templates/...
      - run: go run ./cmd/harness eval list evals/golden

  # Does this PR touch something a golden regression comes from?
  changes:
    runs-on: ubuntu-latest
    outputs:
      sensitive: ${{ steps.filter.outputs.sensitive }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          # Only the deliberate paid runs are sensitive by default. A push to
          # main has already been gated as a pull request, so paying for the
          # suite again on merge doubles the spend for no new signal -- and
          # because this job queues rather than cancels, a run of commits bills
          # for every one of them.
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch)
              echo "sensitive=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            push)
              echo "sensitive=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          base=$(git merge-base origin/${{ github.base_ref }} HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          echo "changed files:"; echo "$changed"
          # The regression gate's remit, from plan Step 20: prompt templates,
          # CLAUDE.md, tool policies, the evaluation pipeline, the pinned CLI
          # and model, and the suite itself.
          if echo "$changed" | grep -Eq '^(templates/|CLAUDE\.md$|evals/|internal/eval/|internal/runner/version\.go$|harness\.example\.yaml$|worker/)'; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi

  gate:
    needs: changes
    # A fork PR has no access to the worker credential, and a suite that cannot
    # spawn a worker would report a false regression on every case.
    if: >-
      needs.changes.outputs.sensitive == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      # One paid suite at a time: two concurrent runs would double the spend
      # and race for the same daily budget.
      group: golden-gate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the pinned Claude Code CLI
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^const PinnedCLIVersion = "\(.*\)"$/\1/p' internal/runner/version.go)
          echo "pinned CLI: $pinned"
          npm install -g "@anthropic-ai/claude-code@$pinned"
          claude --version

      - name: Run the golden suite
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # A single sample disagrees with itself: two runs of an unchanged
          # harness split 4 of 21 cases. The nightly scores the majority of
          # three so a flake is not read as a regression.
          repeat=1
          if [ "${{ github.event_name }}" = "schedule" ]; then repeat=3; fi
          go run ./cmd/harness eval run evals/golden \
            -config evals/golden.ci.yaml \
            -max-cost "$MAX_COST_USD" \
            -repeat "$repeat" \
            -out evals/reports/run.json \
            || echo "suite reported failures; the gate below decides"
          # The line above swallows a case failure on purpose, but it also
          # swallows a suite that never started. Without the report there is
          # nothing to gate, and the gate's "no such file" is a confusing way
          # to learn that the config was rejected.
          test -f evals/reports/run.json || {
            echo "::error::the suite wrote no report - it failed before running any case"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-report
          path: evals/reports/run.json

      - name: Regression gate
        run: |
          set -euo pipefail
          # Both bars, always: the delta catches a sudden regression, the floor
          # stops a slow ratchet where each night is "only" one case worse than
          # the last.
          if [ -f "$BASELINE" ]; then
            go run ./cmd/harness eval gate -baseline "$BASELINE" -report evals/reports/run.json \
              -max-drop 0.05 -min-pass-rate "$MIN_PASS_RATE"
          else
            echo "no baseline at $BASELINE; enforcing the absolute floor only"
            go run ./cmd/harness eval gate -report evals/reports/run.json -min-pass-rate "$MIN_PASS_RATE"
          fi

      # The nightly run on main is what the next PR is measured against. A
      # baseline may only ever move sideways or up: blessing a worse run makes
      # tonight's regression tomorrow's target, which is exactly how the bar
      # walks down one case at a time.
      - name: Publish the baseline
        if: github.event_name == 'schedule' && success()
        run: |
          set -euo pipefail
          new=$(jq -r '.totals.pass_rate' evals/reports/run.json)
          if [ -f "$BASELINE" ]; then
            old=$(jq -r '.totals.pass_rate' "$BASELINE")
            if awk "BEGIN{exit !($new < $old)}"; then
              echo "::warning::pass rate $new is below the baseline $old; keeping the old baseline"
              exit 0
            fi
          fi
          echo "blessing a baseline at pass rate $new"
          cp evals/reports/run.json "$BASELINE"
          cp evals/reports/run.json "evals/reports/$(date -u +%F).json"
          git config user.name harness-bot
          git config user.email harness-bot@users.noreply.github.com
          git add evals/reports
          git commit -m "golden: nightly baseline $(date -u +%F)" || exit 0
          git push
