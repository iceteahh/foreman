# Copy to harness.yaml. Every key is optional; defaults are in internal/config.
server:
  addr: ":8080"
data_root: ../foreman-data          # sqlite db, audit logs, session snapshots, workspaces
database:
  driver: sqlite                # sqlite (single node) | postgres (stateless replicas, plan Step 22)
  dsn_env: HARNESS_POSTGRES_DSN # the DSN carries a password, so the file holds the variable name
  dsn: ""                       # or a literal for local dev; "$NAME" reads the environment
concurrency:
  global: 2
  per_kind: { code_fix: 2, report: 1, triage: 1 }
# Note: map-valued keys (budgets.daily_usd, concurrency.per_kind, env) merge
# with the defaults in internal/config rather than replacing them; set a key
# to 0 to remove a ceiling.
budgets:
  per_run_usd_default: 2.50
  # Daily ceilings in USD. Intake answers 429 for a saturated kind, the
  # orchestrator stops leasing it, and the global breach opens a circuit
  # breaker that pages. `judge` is its own key.
  daily_usd: { code_fix: 60, code_fix_planned: 30, judge: 10, report: 25, triage: 15, global: 120 }
worker:
  mode: local                   # local (host CLI) | docker (one container per run) | k8s (one Job per run)
  claude_bin: claude
  image: harness/worker:cli-2.1.270   # docker mode; must carry the pinned CLI
  budget_flag_ratio: 0.9        # --max-budget-usd = ratio × policy.max_cost_usd
  api_key_env: ANTHROPIC_API_KEY
  oauth_token_env: CLAUDE_CODE_OAUTH_TOKEN   # alternative credential from `claude setup-token`
  grace_ms: 10000               # SIGTERM → SIGKILL
  check_version: true           # refuse to start on CLI version drift (checks the image in docker mode)
  docker:                       # only used when mode: docker
    bin: docker
    network: harness-internal   # create it with `docker network create --internal harness-internal`
    user: host                  # "host" = the harness's uid:gid on Linux; "" keeps the image user
    egress_proxy: http://egress:3128   # `harness egress` allowlist proxy
    no_proxy: "localhost,127.0.0.1"
    memory: 4g
    cpus: 2
    pids_limit: 512
    read_only_root: false       # true needs a toolchain that writes only to /tmp and $HOME
    kill_timeout_ms: 120000
    extra_args: []              # e.g. ["--add-host=host.docker.internal:host-gateway"]
    host_data_root: ""          # data_root as the HOST sees it; set only when the harness
                                # itself runs in a container (worker containers are siblings,
                                # so the daemon resolves their mounts on the host).
                                # "$NAME" is read from the environment.
  k8s:                          # only used when mode: k8s (see deploy/k8s for the chart)
    kubectl: kubectl
    namespace: harness
    credential_secret: harness-worker   # a Secret whose keys become the worker's environment;
                                        # the only way a credential reaches a Job (never argv)
    service_account: harness            # the orchestrator's; worker pods get no API token at all
    data_claim: harness-data    # ReadWriteMany PVC holding data_root: the orchestrator writes the
                                # checkout and the Job mounts that subPath, so both hold it at once
    image_pull_policy: IfNotPresent
    node_selector: { harness.io/pool: workers }
    cpu_request: 500m
    cpu_limit: "2"
    memory_request: 1Gi
    memory_limit: 4Gi
    run_as_user: 1000
    fs_group: 1000
    ttl_seconds: 600            # delete the finished Job (its logs are already in the audit sink)
    start_timeout_seconds: 300  # how long to wait for the pod to be scheduled and pulled
    egress_proxy: ""            # e.g. http://harness-egress:3128
egress:                         # `harness egress` (workers reach only these hosts)
  addr: ":3128"
  allow: [api.anthropic.com, "*.github.com", github.com, "*.githubusercontent.com",
          proxy.golang.org, sum.golang.org, storage.googleapis.com, registry.npmjs.org]
  ports: [443, 80]
observability:
  enabled: false                # true: OTel metrics + one trace per run
  otlp_endpoint: ""             # e.g. localhost:4318
  otlp_insecure: false
  prometheus_addr: ":9464"      # /metrics; "" disables
  metric_interval_ms: 30000
  trace_sample_ratio: 1
  environment: local
  progress: log                 # off | log | slack (live per-run timeline)
  progress_interval_ms: 15000
audit:
  sink: file                    # file | s3 (MinIO or AWS)
  endpoint: ""                  # e.g. localhost:9000
  bucket: ""
  prefix: runs/
  region: ""
  access_key_env: AWS_ACCESS_KEY_ID
  secret_key_env: AWS_SECRET_ACCESS_KEY
  use_ssl: true
  spool: ""                     # default <data_root>/audit; logs live here until uploaded
judge:
  default_threshold: 7          # min rubric score before a run goes to human review
  model: ""                     # "" = CLI default; e.g. haiku to keep judging cheap
  max_turns: 12                 # 5 was too few: the judge hit its own turn cap and returned uncertain
  max_cost_usd: 0.25
  timeout_ms: 180000
  parallel: false               # run judge samples concurrently
review:
  slack_channel: "#agent-review"   # channel name or C… id
  sla_hours: 24                    # unanswered reviews are re-posted with the mention
  slack_bot_token_env: SLACK_BOT_TOKEN          # xoxb-…; unset → reviews are logged, decide via API/CLI
  slack_signing_secret_env: SLACK_SIGNING_SECRET
  escalation_mention: "<!here>"
  escalation_check_minutes: 5
github:
  token_env: GITHUB_TOKEN
  webhook_secret_env: GITHUB_WEBHOOK_SECRET
  repo_base: https://github.com/
  draft_prs: true
  trigger_label: harness        # issues carrying this label become tasks
  kind: code_fix                # or code_fix_planned (plan → approve → implement)
queue:
  poll_interval_ms: 1000
  max_job_attempts: 5
  api_error_backoff_seconds: 60
session:                        # transcript snapshots (design §4.4)
  store: local                  # local | s3 — k8s workers need s3: the next attempt may land
                                # on another node, where a local snapshot no longer exists
  root: ""                      # local: default <data_root>/sessions
  endpoint: ""                  # s3: e.g. localhost:9000
  bucket: ""
  prefix: sessions/
  region: ""
  use_ssl: true
  access_key_env: AWS_ACCESS_KEY_ID
  secret_key_env: AWS_SECRET_ACCESS_KEY
fanout:                          # plan Step 21: planner → parallel children → synthesizer
  max_children: 8               # runaway guard: a planner asking for 40 workers spends 40 budgets
  sweep_minutes: 5              # how often to look for parents whose children all finished
retention:
  workspaces: destroy_on_capture   # or keep
  sessions_days: 30                # transcript snapshots of finished tasks are deleted after this
  audit_ndjson_days: 365           # enforced by the bucket policy, not the harness
env:                             # extra vars passed to workers and acceptance commands
  GOFLAGS: "-mod=mod"
cron: []
