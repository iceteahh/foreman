# Alerting rules for design §8: dead-letter arrivals, budget breaches,
# permission-denial spikes, queue starvation, unconfirmed kills and stranded
# runs. Point Alertmanager at these, or read them in Grafana. Mounted as
# /etc/prometheus/rules.yaml.
#
# The golden regression gate has no rule here on purpose: it runs in CI, not in
# the harness, and a blocked gate already fails the workflow (.github/workflows/golden.yml).
groups:
  - name: harness
    interval: 30s
    rules:
      - alert: HarnessDeadLetter
        expr: increase(harness_dead_letters_total[10m]) > 0
        labels: { severity: page }
        annotations:
          summary: "A harness run exhausted its retries"
          description: "Run `harness requeue -list` to see it, `harness replay <run_id>` for the timeline."

      - alert: HarnessGlobalBudgetExhausted
        # Spend and ceiling are separate series with the same `key` label.
        expr: harness_budget_spend_today_USD{key="global"} >= (harness_budget_limit_USD{key="global"} > 0)
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "Global daily budget reached; the circuit breaker is open"
          description: "No new runs start until the UTC day rolls over. Raise budgets.daily_usd.global to resume."

      - alert: HarnessKindBudgetExhausted
        expr: harness_budget_spend_today_USD >= (harness_budget_limit_USD > 0)
        for: 1m
        labels: { severity: ticket }
        annotations:
          summary: "Daily budget for {{ $labels.key }} reached"
          description: "The orchestrator has stopped leasing that kind and intake answers 429 until the UTC day rolls over."

      # A kill the harness could not confirm: the worker may still be running
      # and billing with nothing tracking it. This is the one alert that costs
      # money for every minute it goes unanswered.
      - alert: HarnessWorkerOrphaned
        expr: increase(harness_workers_orphaned_total[10m]) > 0
        labels: { severity: page }
        annotations:
          summary: "A worker could not be confirmed killed ({{ $labels.kind }})"
          description: "Find the Job named in the page and delete it by hand (`kubectl delete job <name>`), then check `harness budget`."

      # Runs that no job was driving, put back by the sweeper. One is a
      # reclaimed lease and normal; a stream of them means leases are expiring
      # under load, which is the Phase 2 heartbeat work failing for real.
      - alert: HarnessRunsStranded
        expr: increase(harness_runs_stranded_total[30m]) > 3
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Runs keep being stranded and swept back ({{ $labels.kind }})"
          description: "Leases are lapsing mid-run. Check heartbeat errors in the logs and the store's latency."

      # Work is ready and nothing has taken it for longer than three leases.
      # Distinct from HarnessQueueStarved, which needs the pool fully idle:
      # this one fires while other kinds are still running, which is what a
      # per-kind cap or a stuck replica looks like.
      - alert: HarnessQueueStuck
        expr: max(harness_queue_oldest_ready_age_seconds) > 360
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "A job has been ready for more than three leases"
          description: "Check per-kind concurrency caps, the daily budgets, and whether a replica is wedged holding capacity."

      # Dead letters arriving faster than a human can work them: the single
      # HarnessDeadLetter page is for one run, this is for a systemic failure
      # (a broken credential, a repo that no longer builds).
      - alert: HarnessDeadLetterBurst
        expr: increase(harness_dead_letters_total[30m]) > 3
        labels: { severity: page }
        annotations:
          summary: "Dead letters are arriving in bulk ({{ $labels.kind }})"
          description: "Something systemic is failing every run. `harness requeue -list`, then `harness replay <run_id>` on the newest."

      - alert: HarnessPermissionDenialSpike
        expr: sum(rate(harness_permission_denials_total[15m])) > 0.05
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Permission denials are spiking"
          description: "Usually a tool-policy misconfiguration in templates/<kind>/policy.json, not a misbehaving worker."

      - alert: HarnessQueueStarved
        expr: max(harness_queue_oldest_ready_age_seconds) > 1800 and sum(harness_workers_active) == 0
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Jobs are queued but nothing is running"
          description: "Check the daily budgets (harness budget), the rate-limit shed, and the worker credential."

      - alert: HarnessJudgeDisagreement
        expr: sum(rate(harness_review_disagreements_total[1h])) / clamp_min(sum(rate(harness_review_decisions_total[1h])), 0.0001) > 0.3
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "Humans are overriding the judge on more than 30% of reviews"
          description: "The rubric or the threshold needs revisiting; convert the overrides into golden cases (plan Step 19)."
